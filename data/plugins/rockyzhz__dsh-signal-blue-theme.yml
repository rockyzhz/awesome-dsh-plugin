url: https://github.com/rockyzhz/dsh-signal-blue-theme
name: rockyzhz/dsh-signal-blue-theme
category: theme
description:
  en: "Swiss-style theme built on a single electric-blue accent (#1B3BFF): cold paper with a pale blue sidebar in light mode, deep navy night in dark mode, square corners and hairline edges instead of shadows, plus a spec page carrying the measured contrast ratios."
  zh: "瑞士风主题，全界面只有一个电蓝强调色（#1B3BFF）：浅色是冷白纸面配淡蓝侧栏，深色是深蓝夜底，直角与发丝线替代阴影；另附一页带实测对比度的配色说明。"
